name: deploy
on:
  workflow_dispatch:
    inputs:
      kicked:
        description: "1 when this run was started by the live check after a stuck deploy"
        default: "0"
permissions:
  contents: write  # the live check may push one empty commit (new Pages build version)
  pages: write
  id-token: write
  actions: write   # ...and re-dispatch this workflow on it
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        id: a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/assets _site/rel
          cp lw.js CNAME _site/ && cp assets/* _site/assets/ && cp assets/favicon.svg _site/
          cp -r 3d _site/3d   # 3D version of the dashboard (static; same data.enc)
          for i in 1 2 3 4; do
            gh release download data -D _site/rel --clobber -R "$GITHUB_REPOSITORY" && break
            sleep 5
          done
          mv _site/rel/data.enc _site/rel/index.html _site/
          for f in _site/rel/*; do
            [ -f "$f" ] || continue
            mv "$f" _site/assets/"$(basename "$f")"
          done
          rm -rf _site/rel
          # every CSS the 2D/3D pages link (packages/ui, via the release) must be in the site
          for css in $(grep -oh '/assets/[A-Za-z0-9._-]*[.]css' _site/index.html _site/3d/index.html | sort -u); do
            test -s "_site$css" || { echo "::error::missing linked $css"; exit 1; }
          done
          test -s _site/assets/crypto_gate.js || { echo "::error::missing /assets/crypto_gate.js"; exit 1; }
          test -s _site/data.enc && test -s _site/index.html
          touch _site/.nojekyll
          echo "sum=$(sha256sum _site/data.enc | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
      - name: live check
        env:
          SUM: ${{ steps.a.outputs.sum }}
          KICKED: ${{ inputs.kicked }}
          GH_TOKEN: ${{ github.token }}
          SITE: https://workflow.liteya.ru
          TRIES: "24"
          WAIT: "5"
        run: |
          # Pages keys a deployment by pages_build_version = GITHUB_SHA (actions/deploy-pages#383).
          # Every dispatch runs on the same commit, so Pages may ack "succeed" for the old
          # deployment and keep serving it. Check what is really served; if it is stale,
          # push one empty commit (a new build version) and deploy again on it, once.
          for i in $(seq 1 "$TRIES"); do
            got=$(curl -fsS "$SITE/data.enc?t=$(date +%s%N)" | sha256sum | cut -c1-64) || got=none
            if [ "$got" = "$SUM" ]; then
              curl -fsS -o /dev/null "$SITE/assets/crypto_gate.js" || { echo "::error::$SITE/assets/crypto_gate.js is not served"; exit 1; }
              echo "live after $i tries"; exit 0; fi
            sleep "$WAIT"
          done
          if [ "$KICKED" = "1" ]; then
            echo "::error::data.enc is still stale after a new build version"
            exit 1
          fi
          echo "::warning::Pages kept the old deployment; new build version and redeploy"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -q -m "pages: new build version (stale deploy)"
          git push -q origin HEAD:main
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main -f kicked=1
