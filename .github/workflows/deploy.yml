name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        id: a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/assets
          cp lw.js CNAME _site/ && cp assets/* _site/assets/ && cp assets/favicon.svg _site/
          cp -r 3d _site/3d   # 3D version of the dashboard (static; same data.enc)
          for i in 1 2 3 4; do
            gh release download data -p data.enc -p index.html -D _site --clobber -R "$GITHUB_REPOSITORY" && break
            sleep 5
          done
          test -s _site/data.enc && test -s _site/index.html
          touch _site/.nojekyll
          # Pages keys a deployment by its build version (GITHUB_SHA by default). Every
          # deploy here runs on the same commit, so a repeat version was acknowledged as
          # "succeed" but never went live. Make it unique per site content and run.
          sum=$(sha256sum _site/data.enc | cut -c1-64)
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
          echo "build=$(printf '%s %s %s %s' "$GITHUB_SHA" "$sum" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.a.outputs.build }}
      - name: live check
        env:
          SUM: ${{ steps.a.outputs.sum }}
        run: |
          # fail loudly if Pages did not actually serve the new data.enc
          for i in $(seq 1 24); do
            got=$(curl -fsS "https://workflow.liteya.ru/data.enc?t=$(date +%s%N)" | sha256sum | cut -c1-64) || got=none
            if [ "$got" = "$SUM" ]; then echo "live after ${i} tries"; exit 0; fi
            sleep 5
          done
          echo "::error::data.enc on workflow.liteya.ru is not the deployed one after 2 min"
          exit 1
