name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/assets
          cp lw.js CNAME _site/ && cp assets/* _site/assets/ && cp assets/favicon.svg _site/
          for i in 1 2 3 4; do
            gh release download data -p data.enc -p index.html -D _site --clobber -R "$GITHUB_REPOSITORY" && break
            sleep 5
          done
          test -s _site/data.enc && test -s _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
